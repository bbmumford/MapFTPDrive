version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 5
    groups:
      # A dependency joins the first group that matches it. rclone comes
      # first so each rclone release arrives as its own single pull request:
      # it carries the extracted mount adapter, which must be re-extracted
      # and re-patched as third_party/rclone/UPSTREAM.md describes before
      # the update merges.
      rclone:
        patterns:
          - github.com/rclone/rclone
        update-types:
          - major
          - minor
          - patch
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
