name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: Version used for a dry-run installer build
        required: true
        default: 0.0.0-dev

# No job inherits a token scope; each job below names only what it uses.
permissions: {}

jobs:
  checks:
    name: Test, vet, lint and vulnerability gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Installer ${{ matrix.arch }}
    needs: checks
    runs-on: windows-latest
    # This job holds the signing secrets, so its token can only read the
    # repository; provenance and publishing happen in the publish job.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release build never restores a cache another workflow wrote.
          cache: false
      - name: Install WiX Toolset
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:EVENT_NAME -eq "push") { $env:REF_NAME.TrimStart("v") } else { $env:INPUT_VERSION }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Version '$version' is not MAJOR.MINOR.PATCH[-PRERELEASE]"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build and package
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: >
          ./scripts/build-installer.ps1
          -Architecture "${{ matrix.arch }}"
          -Version "${{ steps.version.outputs.value }}"
          -Commit "${{ github.sha }}"
      - name: Build MSI
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: >
          ./scripts/build-msi.ps1
          -Architecture "${{ matrix.arch }}"
          -Version "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.arch }}
          path: |
            installer/output/MapFTPDrive-*-setup*.exe
            installer/output/MapFTPDrive-*-setup*.exe.sha256
            installer/output/MapFTPDrive-*.msi
            installer/output/MapFTPDrive-*.msi.sha256
          if-no-files-found: error

  smoke:
    name: MSI smoke test ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-${{ matrix.arch }}
          path: dist
      - name: Install, exercise and uninstall the setup bundle and the MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Get-ChildItem dist -Filter "MapFTPDrive-*-bundle-setup*.exe" | Where-Object { $_.Name -notlike "*.sha256" } | Select-Object -First 1
          $msi = Get-ChildItem dist -Filter "MapFTPDrive-*.msi" | Select-Object -First 1
          if (-not $bundle) { throw "No setup bundle in the installer artifact" }
          if (-not $msi) { throw "No MSI in the installer artifact" }
          $exe = Join-Path $env:ProgramFiles "MapFTPDrive\MapFTPDrive.exe"

          function Assert-Ok([System.Diagnostics.Process]$Process, [string]$What, [string]$Log) {
            if ($Process.ExitCode -notin 0, 3010) {
              if (Test-Path $Log) { Get-Content $Log -Tail 200 }
              throw "$What exited with $($Process.ExitCode)"
            }
          }

          # The bundle is the path a user takes: it installs WinFsp when
          # missing, then the MSI.
          function Invoke-Bundle([string[]]$Arguments, [string]$Log) {
            $process = Start-Process $bundle.FullName -Wait -PassThru -ArgumentList ($Arguments + @("/quiet", "/norestart", "/log", "`"$Log`""))
            Assert-Ok $process "Setup bundle $($Arguments -join ' ')" $Log
          }

          function Invoke-Msiexec([string]$Action, [string]$Log) {
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
              $Action, "`"$($msi.FullName)`"", "/qn", "/norestart", "/l*v", "`"$Log`"")
            Assert-Ok $process "msiexec $Action" $Log
          }

          function Assert-Installed {
            $service = Get-CimInstance Win32_Service -Filter "Name='MapFTPDrive'"
            if (-not $service) { throw "The MapFTPDrive service is not registered" }
            if ($service.StartMode -ne "Auto") { throw "Service start mode is $($service.StartMode), expected Auto" }
            if ($service.PathName -notlike "*MapFTPDrive.exe*service*") { throw "Unexpected service command: $($service.PathName)" }
            Start-Sleep -Seconds 5
            $state = (Get-Service MapFTPDrive).Status
            Write-Output "Service registered: $($service.PathName) ($state)"
            $stdout = Join-Path $env:RUNNER_TEMP "version.txt"
            $process = Start-Process $exe -ArgumentList "version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout
            $version = Get-Content $stdout -Raw
            if ($process.ExitCode -ne 0 -or $version -notmatch '^MapFTPDrive ') {
              throw "MapFTPDrive.exe version failed ($($process.ExitCode)): $version"
            }
            Write-Output $version.Trim()
          }

          function Assert-Removed {
            if (Get-Service MapFTPDrive -ErrorAction SilentlyContinue) { throw "The service remains after uninstall" }
            if (Test-Path $exe) { throw "$exe remains after uninstall" }
          }

          function Test-WinFsp {
            (Test-Path "HKLM:\SOFTWARE\WOW6432Node\WinFsp") -or (Test-Path "HKLM:\SOFTWARE\WinFsp")
          }

          Invoke-Bundle @() (Join-Path $env:RUNNER_TEMP "bundle-install.log")
          if (-not (Test-WinFsp)) { throw "The bundle did not install WinFsp" }
          Assert-Installed
          Invoke-Bundle @("/uninstall") (Join-Path $env:RUNNER_TEMP "bundle-uninstall.log")
          Assert-Removed
          # WinFsp is shared, so the bundle leaves it installed.
          if (-not (Test-WinFsp)) { throw "Uninstalling the bundle removed WinFsp" }
          Write-Output "Bundle installed and removed; WinFsp kept"

          # The plain MSI is for computers that already have WinFsp.
          Invoke-Msiexec "/i" (Join-Path $env:RUNNER_TEMP "install.log")
          Assert-Installed
          Invoke-Msiexec "/x" (Join-Path $env:RUNNER_TEMP "uninstall.log")
          Assert-Removed
          Write-Output "MSI installed and removed"
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [checks, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Build combined checksum manifest
        working-directory: dist
        run: cat *.sha256 | sort > SHA256SUMS
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/MapFTPDrive-*-setup*.exe
            dist/MapFTPDrive-*.msi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "MapFTPDrive ${GITHUB_REF_NAME}"
