name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this workflow as its test, vet, lint and
  # vulnerability gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so a release run never
  # cancels or is cancelled by a CI run for the same ref.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  # The WinFsp redistributable the installers bundle. The Windows job checks
  # that both packaging scripts still pin this exact URL and SHA-256.
  WINFSP_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  source:
    name: Portable source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test portable packages with the race detector
        run: go test -race -mod=vendor ./...
      - name: Vet
        run: go vet -mod=vendor ./...
      - name: Verify module checksums
        run: go mod verify
      - name: Verify the vendor tree matches go.mod and go.sum
        shell: bash
        run: |
          go mod vendor
          git diff --exit-code -- vendor
          test -z "$(git status --porcelain -- vendor)"

  windows:
    name: Windows checks
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet -mod=vendor ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # Built with the go.mod toolchain so the linter understands the
          # module's Go version.
          install-mode: goinstall
      - name: Test
        run: go test -mod=vendor ./...
      - name: Verify the WinFsp pin matches the packaging scripts
        shell: pwsh
        run: |
          foreach ($script in "scripts/build-installer.ps1", "scripts/build-msi.ps1") {
            foreach ($value in $env:WINFSP_URL, $env:WINFSP_SHA256) {
              if (-not (Select-String -Path $script -SimpleMatch -Quiet $value)) {
                throw "$script does not pin $value; update WINFSP_URL/WINFSP_SHA256 in ci.yml with it"
              }
            }
          }
      - name: Install WinFsp headers for the race build
        # The race detector needs cgo, and cgofuse's cgo build includes the
        # WinFsp FUSE headers from the Developer feature.
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "winfsp.msi"
          Invoke-WebRequest -Uri $env:WINFSP_URL -OutFile $msi
          $actual = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          if ($actual -ne $env:WINFSP_SHA256) { throw "WinFsp checksum mismatch: got $actual" }
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", "`"$msi`"", "/qn", "/norestart", "ADDLOCAL=F.User,F.Developer")
          if ($process.ExitCode -notin 0, 3010) { throw "WinFsp install failed: $($process.ExitCode)" }
          $installDir = (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\WinFsp").InstallDir
          "CPATH=$(Join-Path $installDir 'inc\fuse')" >> $env:GITHUB_ENV
      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -mod=vendor ./...
      - name: Build
        shell: pwsh
        run: |
          foreach ($arch in "amd64", "arm64") {
            $env:GOOS = "windows"
            $env:GOARCH = $arch
            go build -mod=vendor -trimpath -o "build/MapFTPDrive-$arch.exe" ./cmd/mapftpdrive
            if ($LASTEXITCODE -ne 0) { throw "go build failed for $arch" }
          }
      - name: Vulnerability scan
        shell: pwsh
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@$env:GOVULNCHECK_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "govulncheck install failed" }
          $govulncheck = Join-Path (go env GOPATH) "bin/govulncheck.exe"
          foreach ($arch in "amd64", "arm64") {
            $env:GOOS = "windows"
            $env:GOARCH = $arch
            & $govulncheck ./...
            if ($LASTEXITCODE -ne 0) { throw "govulncheck reported vulnerabilities for windows/$arch" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-binaries
          path: build/MapFTPDrive-*.exe
          if-no-files-found: error
